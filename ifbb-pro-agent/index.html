<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Agente de preparación física estilo IFBB Pro: plan de entrenamiento, dieta y medidas objetivo basados en evidencia científica citada. Funciona sin conexión y guarda varios perfiles.">
  <title>IFBB Pro Agent</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <div>
        <h1>IFBB Pro Agent</h1>
        <p id="active-profile-label">Sin perfil activo</p>
      </div>
    </div>
    <button id="btn-install" class="btn btn-ghost" hidden>Instalar</button>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" aria-label="Secciones">
    <button data-tab="profiles" class="tab active" aria-label="Perfiles"><span class="ico">👤</span><span>Perfiles</span></button>
    <button data-tab="data" class="tab" aria-label="Datos"><span class="ico">📋</span><span>Datos</span></button>
    <button data-tab="plan" class="tab" aria-label="Plan"><span class="ico">🎯</span><span>Plan</span></button>
    <button data-tab="progress" class="tab" aria-label="Progreso"><span class="ico">📈</span><span>Progreso</span></button>
    <button data-tab="sources" class="tab" aria-label="Fuentes"><span class="ico">📚</span><span>Fuentes</span></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/knowledge.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
